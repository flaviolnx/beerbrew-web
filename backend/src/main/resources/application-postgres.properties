spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/beerbrew}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:beerbrew}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:beerbrew}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10