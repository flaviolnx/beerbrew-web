---
apiVersion: v1
kind: Secret
metadata:
  name: beerbrew-db-secret
  labels:
    app: beerbrew-web
type: Opaque
stringData:
  POSTGRES_DB: beerbrew
  POSTGRES_USER: beerbrew
  POSTGRES_PASSWORD: change-me-strong-password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beerbrew-pgdata
  labels:
    app: beerbrew-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beerbrew-postgres
  labels:
    app: beerbrew-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: beerbrew-postgres
  template:
    metadata:
      labels:
        app: beerbrew-postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:18-alpine
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: beerbrew-db-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: beerbrew-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: beerbrew-db-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "beerbrew", "-d", "beerbrew"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "beerbrew", "-d", "beerbrew"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: beerbrew-pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: beerbrew-postgres
  labels:
    app: beerbrew-postgres
spec:
  selector:
    app: beerbrew-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beerbrew-web
  labels:
    app: beerbrew-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beerbrew-web
  template:
    metadata:
      labels:
        app: beerbrew-web
    spec:
      initContainers:
        - name: wait-for-postgres
          image: docker.io/library/postgres:18-alpine
          command:
            - sh
            - -c
            - until pg_isready -h beerbrew-postgres -p 5432 -U beerbrew; do echo "Waiting for Postgres..."; sleep 2; done
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: beerbrew-web
          # Replace with your pushed registry image or internal OpenShift ImageStream
          image: quay.io/flaviolnx/beerbrew-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://beerbrew-postgres:5432/beerbrew
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: beerbrew-db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: beerbrew-db-secret
                  key: POSTGRES_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
          readinessProbe:
            httpGet:
              path: /api/recipes
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/recipes
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: beerbrew-web
  labels:
    app: beerbrew-web
spec:
  selector:
    app: beerbrew-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: beerbrew-web
  labels:
    app: beerbrew-web
spec:
  to:
    kind: Service
    name: beerbrew-web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
